<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Hits Overview</title>
  <style>
    :root {
      --bg-dark: #0d2440;
      --card-bg: #1d1c38;
      --accent: #2e5e99;
      --text: #f9f9f8;
      --badge-bg: #7ba4d0;
      --badge-text: #0d2440;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      padding: 2rem;
      margin: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #84aff3;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .stats-table th, 
    .stats-table td {
      padding: 1rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stats-table th {
      background: var(--accent);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hit-count {
      font-weight: bold;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.9rem;
      display: inline-block;
    }

    .refresh-btn {
      margin-top: 1.5rem;
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: var(--text);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .refresh-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Page Hit Analytics</h1>
    <p class="subtitle">Live hits fetched directly via CounterAPI</p>

    <table class="stats-table">
      <thead>
        <tr>
          <th>Page</th>
          <th>Total Hits</th>
        </tr>
      </thead>
      <tbody id="stats-body">
        <tr>
          <td colspan="2">Loading stats...</td>
        </tr>
      </tbody>
    </table>

    <button class="refresh-btn" onclick="loadStats()">Refresh Counts</button>
  </div>

  <script>
    const NAMESPACE = 'waoumii-site';
    
    // List all page keys you want to monitor
    const trackedPages = [
      'home',
      'portfolio',
      'creative',
      'case-study',
      'project'
    ];

    async function loadStats() {
      const tbody = document.getElementById('stats-body');
      tbody.innerHTML = '';

      for (const page of trackedPages) {
        try {
          // Get current count without incrementing
          const res = await fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/${page}`);
          const data = await res.json();
          const count = data.count !== undefined ? data.count : 0;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td><code>${page}</code></td>
            <td><span class="hit-count">${count}</span></td>
          `;
          tbody.appendChild(row);
        } catch (err) {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><code>${page}</code></td>
            <td><span style="color: #f37b63;">0 (Not initialized)</span></td>
          `;
          tbody.appendChild(row);
        }
      }
    }

    // Load stats on page open
    loadStats();
  </script>

</body>
</html>
